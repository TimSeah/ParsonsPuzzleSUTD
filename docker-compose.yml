services:
  # Frontend service - React app served by Nginx
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  # Backend service - Node.js/Express API
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    # Optional: OPENAI_API_KEY, OPENAI_MODEL, limits, etc. The values under
    # `environment` below take precedence (needs Docker Compose 2.24+).
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/parsonspuzzle
      - FRONTEND_URL=http://localhost:3000
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      # Used only when the lean-worker service runs (profile "generation")
      - LEAN_VERIFY_URL=http://lean-worker:3001/verify
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # Lean 4 + Mathlib proof checker for AI generation. Large image (several GB)
  # and memory-hungry, so it only starts with: docker compose --profile generation up
  # Not published on the host; only the backend can reach it.
  lean-worker:
    build:
      context: ./lean-worker
    profiles: ["generation"]
    environment:
      - LEAN_MAX_CONCURRENT=1
      - LEAN_MAX_QUEUE=2
    restart: unless-stopped
    networks:
      - app-network

  # MongoDB service - Local database
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=parsonspuzzle
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
